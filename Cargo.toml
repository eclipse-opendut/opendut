[workspace]
members = [
    "opendut-auth",
    "opendut-auth/opendut-auth-tests",
    "opendut-carl",
    "opendut-carl/opendut-carl-api",
    "opendut-cleo",
    "opendut-edgar",
    "opendut-edgar/netbird-client-api",
    "opendut-edgar/opendut-edgar-kernel-modules",
    "opendut-edgar/plugin-api",
    "opendut-lea",
    "opendut-lea/opendut-lea-components",
    "opendut-model",
    "opendut-telemetry",
    "opendut-util",
    "opendut-viper/viper-cli",
    "opendut-viper/viper-py",
    "opendut-viper/viper-py/viper-pygen",
    "opendut-viper/viper-py/viper-pygen/example",
    "opendut-viper/viper-rt",
    "opendut-viper/viper-rt/viper-containers",
    "opendut-viper/example",
    "opendut-vpn",
    "opendut-vpn/opendut-vpn-netbird",
    ".ci/cargo-ci",
    ".ci/deploy/opendut-theo",
    "tests",
]
resolver = "3"

[workspace.package]
version = "0.10.0-alpha"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/eclipse-opendut/opendut"

[workspace.dependencies]
opendut-auth = { path = "opendut-auth" }
opendut-auth-tests = { path = "opendut-auth/opendut-auth-tests" }
opendut-carl = { path = "opendut-carl" }
opendut-carl-api = { path = "opendut-carl/opendut-carl-api" }
opendut-ci = { path = ".ci/cargo-ci" }
opendut-edgar = { path = "opendut-edgar" }
opendut-edgar-plugin-api = { path = "opendut-edgar/plugin-api" }
opendut-edgar-kernel-modules = { path = "opendut-edgar/opendut-edgar-kernel-modules" }
opendut-lea-components = { path = "opendut-lea/opendut-lea-components" }
opendut-netbird-client-api = { path = "opendut-edgar/netbird-client-api" }
opendut-model = { path = "opendut-model" }
opendut-telemetry = { path = "opendut-telemetry" }
opendut-theo = { path = ".ci/deploy/opendut-theo" }
opendut-util = { path = "opendut-util" }
opendut-viper-py = { path = "opendut-viper/viper-py", default-features = false }
opendut-viper-pygen = { path = "opendut-viper/viper-py/viper-pygen", default-features = false }
opendut-viper-rt = { path = "opendut-viper/viper-rt", default-features = false }
opendut-viper-containers = { path = "opendut-viper/viper-rt/viper-containers", default-features = false }
opendut-vpn = { path = "opendut-vpn" }
opendut-vpn-netbird = { path = "opendut-vpn/opendut-vpn-netbird" }

anyhow = "1.0"
assert_fs = "1.1"
async-trait = "0.1"
axum = "0.8"
axum-server = "0.7"
axum-server-dual-protocol = "0.7"
backon = "1.6"
base64 = "0.22"
bitflags = "2.9"
brotli = "8.0"
bollard = { version = "0.19", default-features = false }
byteorder = "1.5"
cargo_metadata = "0.23"
cargo_toml = "0.22"
cfg-if = "1.0.0"
chrono = { version = "0.4", default-features = false }
cicero = "0.11"
clap = "4.5"
clap_complete = "4.5"
clap-verbosity-flag = { version = "3", default-features = false, features = ["tracing"] }
cli-table = "0.5"
config = { version = "0.15", default-features = false, features = ["toml", "yaml"] }
console = "0.16"
console_error_panic_hook = "0.1"
const_format = "0.2"
ctrlc = "3.5"
digest = "0.11"
dotenvy = "0.15"
flate2 = "1.1"
fs-err = "3.3"
fs_extra = "1.3"
futures = "0.3"
glob = "0.3"
gloo-net = "0.7"
gloo-timers = "0.4"
googletest = "0.14"
home = "0.5"
http = "1.4"
http-body = "1.0"
http-body-util = "0.1"
httpmock = "0.8"
hyper = "1.6"
hyper-util = "0.1"
indexmap = { version = "2" } # align with 'rustpython-vm'
indicatif = "0.18"
indoc = "2"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
leptos = "0.8"
leptos_oidc = "0.9"
leptos_router = "0.8"
leptos-use = "0.18"
mime = "0.3"
mockall = "0.14"
nix = "0.31"
oauth2 = { version = "5.0", default-features = false }
openidconnect = { version = "4.0", default-features = false }
opentelemetry = "0.31.0"
opentelemetry-appender-tracing = "0.31.1"
opentelemetry-otlp = "0.31.0"
opentelemetry_sdk = "0.31.0"
opentelemetry-semantic-conventions = "0.31.0"
pem = { version = "3.0", features = ["serde"] }
phf = { version = "0.13", features = ["macros"] }
ping-rs = "0.1"
pin-project-lite = "0.2"
predicates = "3.1"
proc-macro2 = "1.0"
prost = "0.14"
prost-types = "0.14"
protobuf-src = "1.1"
quote = "1.0"
rand = "0.10"
reactive_stores = "0.4"
reactive_stores_macro = "0.4"
redb = "3.1"
regex = "1.11"
repo_path = "1"
reqwest = "0.13"
reqwest-middleware = "0.5"
reqwest-retry = "0.9"
rtnetlink = "0.18"
rustls = { version = "*", default-features = false, features = ["ring"] }
rustpython-vm = "0.4"
semver = "1.0"
serde = { version = "1.0", default-features = false }
serde_json = "1.0"
serde-spdx = "0.10"
serde_yaml = "0.9"
shadow-formatted-version = "1.1"
shadow-rs = { version = "1.1", default-features = false }
sha2 = "0.11"
simple_moving_average = "1.0"
slotmap = "1.0"
strum = "0.28"
sudo = "0.6"
syn = "2.0"
sysinfo = "0.38"
tar = "0.4"
task-local-extensions = "0.1"
tempfile = "3"
test-with = { version = "0.16", default-features = false }
test-log = { version = "0.2", default-features = false, features = ["trace", "color"] }
time = "0.3"
thiserror = "2.0"
tokio = { version = "1.43", default-features = false }
tokio-stream = { version = "0.1", default-features = false }
tokio-util = { version = "0.7" }
toml = { version = "1.0", default-features = false }
toml_edit = "0.25"
tonic = { version = "0.14", default-features = false }
tonic-prost = "0.14"
tonic-prost-build = { version = "0.14", default-features = false }
tonic-web = "0.14"
tonic-web-wasm-client = "0.9"
tonic-async-interceptor = "0.14"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing = "0.1"
tracing-opentelemetry = "0.32.0"
tracing-subscriber = { version = "0.3", default-features = false }
tracing-web = "0.1"
trybuild = "1.0"
url = "2.5"
uuid = "1.21"
walkdir = "2.5"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
# v36.x is an LTS release: https://docs.wasmtime.dev/stability-release.html
# Will stick to v36.x for now, because v39+ contains `im-rc` as dependency which is under MPL-2.0.
wasmtime = { version = "36", features = ["component-model", "std", "runtime"] }
wasmtime-wasi = "36"
web-sys = "0.3"
which = "8.0"
wit-bindgen = "0.51"
x509-parser = "0.18"
zip = "8"


[workspace.metadata.ci]
cannelloni.version = "1.1.0"  # mind that this version string is partially hard-coded in the repo

# download netbird client release from here
netbird.repository = "https://github.com/netbirdio/netbird"
# with the following version
netbird.version = "0.64.5"
# and use the protobuf definition for the netbird client service daemon from here (possible separate location to be configured)
netbird.protobuf = "https://raw.githubusercontent.com/netbirdio/netbird/refs/tags/v0.64.5/client/proto/daemon.proto"

rperf.version = "0.1.8"


[workspace.metadata.cicero.commands.dependencies] #CLI tool crates used in CI (not libraries)
cargo-bundle-licenses = "4.2.0"
cargo-deny = "0.19.0"
cargo-sbom = "0.10.0"
cargo-tarpaulin = "0.35.2"
cross = "0.2.5"
mdbook = "0.5.*"
mdbook-plantuml = "2.0.0"
trunk = "0.21.14"

[workspace.lints.clippy]
unnecessary_lazy_evaluations = "allow"
