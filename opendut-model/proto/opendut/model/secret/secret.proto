syntax = "proto3";

package opendut.model.secret;

import "opendut/model/util/uuid.proto";

message SecretId {
    opendut.model.util.Uuid uuid = 1;
}

message SecretName {
    string value = 1;
}

message SecretValue {
    oneof kind {
        string token = 1;
    }
}

message SecretDescriptor {
    SecretId id = 1;
    SecretName name = 2;
    SecretValue value = 3;
}
