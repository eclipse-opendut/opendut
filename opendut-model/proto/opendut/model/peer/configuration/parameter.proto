syntax = "proto3";

package opendut.model.peer.configuration.parameter;

import "opendut/model/util/net.proto";
import "opendut/model/peer/executor/executor.proto";
import "opendut/model/peer/peer.proto";

message DeviceInterface {
  opendut.model.util.NetworkInterfaceDescriptor descriptor = 1;
}

message EthernetBridge {
  opendut.model.util.NetworkInterfaceName name = 1;
}

message Executor {
  opendut.model.peer.executor.ExecutorDescriptor descriptor = 1;
}

message GreInterfaceConfig {
  opendut.model.util.IpV4Address local_ip = 1;
  opendut.model.util.IpV4Address remote_ip = 2;
}

message InterfaceJoinConfig {
  opendut.model.util.NetworkInterfaceName name = 1;
  opendut.model.util.NetworkInterfaceName bridge = 2;
}

message RemotePeerConnectionCheck {
  opendut.model.peer.PeerId remote_peer_id = 1;
  opendut.model.util.IpAddress remote_ip = 2;
}

message CanConnection {
  opendut.model.peer.PeerId remote_peer_id = 1;
  opendut.model.util.IpAddress remote_ip = 2;
  // The single port used for this CAN tunnel.
  // The leader (server) listens on this port; the follower (client) connects to it.
  // Both sides use the follower's assigned can_server_port, so local and remote port are always identical.
  opendut.model.util.Port port = 3;
  // Deprecated: always equal to `port` (field 3). Kept so that a new CARL can still be decoded by an
  // old EDGAR whose generated conversion uses extract!(value.local_port). Remove after one release cycle.
  opendut.model.util.Port local_port = 4 [deprecated = true];
  opendut.model.util.NetworkInterfaceName can_interface_name = 5;
  bool local_is_server = 6;
  // Additional configuration parameters
  uint64 buffer_timeout_microseconds = 11;

}

message CanBridge {
  opendut.model.util.NetworkInterfaceName name = 1;
}

message CanLocalRoute {
  opendut.model.util.NetworkInterfaceName can_source_device_name = 1;
  opendut.model.util.NetworkInterfaceName can_destination_device_name = 2;
}
