syntax = "proto3";

package opendut.model.viper;

import "opendut/model/util/uuid.proto";
import "opendut/model/viper/source.proto";
import "opendut/model/viper_test_id.proto";
import "opendut/model/peer/peer.proto";


message ViperTestRunDescriptor {
  ViperTestId id = 1;
  ViperTestName name = 2;
  opendut.model.viper.ViperSourceId source = 3;
  opendut.model.peer.PeerId peer = 6;
  ViperTestParameters parameters = 7;
}

message ViperTestName {
  string value = 1;
}

message ViperTestParameters {
  repeated ViperTestParameter parameters = 1;
}

message ViperTestParameter {
  string key = 1;
  optional ViperBindingValue value = 2;
}

message ViperBindingValue {
  oneof kind {
    bool boolean = 1;
    int64 number = 2;
    string text = 3;
  }
}
