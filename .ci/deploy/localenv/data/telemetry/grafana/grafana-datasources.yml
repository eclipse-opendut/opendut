apiVersion: 1
datasources:
  # Logs
  - name: Loki
    uid: loki
    type: loki
    isDefault: true
    version: 1
    editable: false
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: "TraceId=(\\w+)"
          name: TraceId
          url: "$${__value.raw}"
      httpHeaderName1: "X-Scope-OrgID"
    secureJsonData:
      httpHeaderValue1: "tenant1"

  # Traces
  # https://grafana.com/docs/grafana/latest/datasources/tempo/configure-tempo-data-source/
  # https://grafana.com/docs/tempo/latest/metrics-from-traces/service_graphs/enable-service-graphs/
  - name: Tempo
    uid: tempo
    type: tempo
    isDefault: false
    version: 1
    editable: false
    access: proxy
    url: http://tempo:3200
    jsonData:
      httpMethod: GET
      serviceMap:
        datasourceUid: 'prometheus'

  # Metrics
  - name: Prometheus
    uid: prometheus
    type: prometheus
    isDefault: false
    version: 1
    editable: false
    access: proxy
    url: http://prometheus:9090
    jsonData:
      httpMethod: GET
