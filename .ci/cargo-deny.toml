# For details, see: https://embarkstudios.github.io/cargo-deny/checks/index.html

[graph]
all-features = true

[advisories]
yanked = "warn"
unmaintained = "workspace"
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "ignore until https://github.com/RustCrypto/RSA/issues/19 is resolved, tracked by issue #144" },

    { id = "RUSTSEC-2026-0387", reason = "`crypto-bigint` is still pulled in via the upstream RustCrypto JWT/OIDC dependency chain. The project code compiles with the direct `jsonwebtoken` 11.x upgrade, but the transitive stack still constrains the lockfile to this vulnerable release until the chain updates. Tracked by issue #603." },


    { id = "RUSTSEC-2026-0391", reason = "`zstd` libraries are vulnerable. Tracked by issue #609." },
    { id = "RUSTSEC-2026-0398", reason = "`zstd` libraries are vulnerable. Tracked by issue #609." },
    { id = "RUSTSEC-2026-0403", reason = "`zstd` libraries are vulnerable. Tracked by issue #609." },
    { id = "RUSTSEC-2026-0410", reason = "`zstd` libraries are vulnerable. Tracked by issue #609." },

    { id = "RUSTSEC-2026-0394", reason = "`rustpython_vm` is unsafe. Tracked by issue #610." },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    # "MPL-2.0",  # Banned for now, as it adds complications for how openDuT can be used (e.g. Apache-2.0 allows proprietary forks, MPL-2.0 does not). See this discussion for more nuance: https://github.com/eclipse-zenoh/zenoh/issues/765
    "Python-2.0.1",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
exceptions = [
    # Malachite is pulled in by RustPython, but incompatible with Apache-2.0. See: https://github.com/eclipse-opendut/opendut/issues/408
    { crate = "malachite",        allow = ["LGPL-3.0-only"] },
    { crate = "malachite-base",   allow = ["LGPL-3.0-only"] },
    { crate = "malachite-bigint", allow = ["LGPL-3.0-only"] },
    { crate = "malachite-nz",     allow = ["LGPL-3.0-only"] },
    { crate = "malachite-q",      allow = ["LGPL-3.0-only"] },
]

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
multiple-versions = "allow"
deny = [
    { crate = "openssl", use-instead = "rustls", reason = "We want to avoid pulling in OpenSSL, if possible, because it makes compilation trickier. See, if the crate you want to use has a feature to enable `rustls`." }  # If you need to lift this ban, add this line to your dependencies to enable the `vendored` feature:  openssl-sys = { version = "*", features = ["vendored"] }
]
