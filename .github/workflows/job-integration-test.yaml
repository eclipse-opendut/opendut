name: integration-test
on:
  workflow_call:  # allow this workflow to be called from other workflows
    inputs:
      runs-on:
        default: "['ubuntu-latest']"
        required: false
        type: string

defaults:
  run:
    shell: bash  # turns on pipefail in all run-blocks: https://github.com/actions/runner-images/issues/4459#issuecomment-1374859960

jobs:
  test:
    name: Test and Verify
    runs-on: ${{ fromJson(inputs.runs-on) }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@44c2b7a8a4ea60a981eaca3cf939b5f4305c123b #4.1.5
      - name: Rust setup
        uses: ./.github/actions/rust-setup

      - name: Free up disk space, to avoid running out mid-build
        uses: endersonmenezes/free-disk-space@e6ed9b02e683a3b55ed0252f1ee469ce3b39a885 #3.1.0
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true

      - name: Install kernel modules
        uses: ./.github/actions/install-kernel-modules

      - name: Run integration test
        run: cargo ci integration-test
