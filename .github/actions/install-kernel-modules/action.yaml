name: Install Kernel Modules
description: Install Kernel Modules

runs:
  using: "composite"
  steps:
    - name: Install and load 'vcan' and 'can-gw' kernel modules
      shell: bash
      run: |
        modules_extra_package="linux-modules-extra-$(uname -r)"
        echo "Kernel modules extra package name: $modules_extra_package"
        echo "Updating the index to check if the package is present."
        sudo apt-get update
        # Some kernels still require linux-modules-extra while others already ship
        # those modules via linux-modules, so install only when the package exists.
        if apt-cache show "$modules_extra_package" >/dev/null 2>&1; then
          echo "Installing $modules_extra_package"
          sudo apt-get install -y \
            "$modules_extra_package"
        else
          echo "Package '$modules_extra_package' not available, skipping."
        fi
        sudo modprobe vcan
        sudo modprobe can-gw max_hops=2
